name: ci

on:
  push:
  pull_request:

jobs:
  moon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s 0.10.19+97801ee1b
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - name: Check
        run: moon check --deny-warn --target native
      - name: Build
        run: moon build --target native
      - name: Test
        run: moon test --deny-warn --target native
      - name: Format
        run: moon fmt --check
